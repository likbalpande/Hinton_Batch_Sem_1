<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket</title>
    <link rel="stylesheet" href="./media.css">
</head>

<body>
    <div class="ticket">
        <div class="ticket-header">
            <p class='event-label'>Live Concert</p>
            <p class='event-name'>Arijit Singh Live</p>
            <p class='tour-info'>The Soulful Experience Tour 2027</p>
        </div>

        <div class="ticket-body">
            <div>
                <p class="tb-label">Date</p>
                <p class="tb-value">15 Jan 2027</p>
            </div>
            <div>
                <p class="tb-label">Time</p>
                <p class="tb-value">7:00 PM</p>
            </div>
            <div>
                <p class="tb-label">Venue</p>
                <p class="tb-value">JLN Stadium</p>
            </div>
        </div>
    </div>
</body>

</html>
